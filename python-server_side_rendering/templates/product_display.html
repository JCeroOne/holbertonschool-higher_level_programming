<!DOCTYPE html>
<html lang="en">
<head>
    <title>Products</title>
</head>
<body>

{% include 'header.html' %}

<h1>Products</h1>

{% if error %}
<p>{{error}}</p>
{% else %}
<table>
  <tr>
    <th>Name</th>
    <th>Category</th>
    <th>Price</th>
  </tr>
  {% for prod in products %}
  <tr>
    <td>{{prod.name}}</td>
    <td>{{prod.category}}</td>
    <td>{{prod.price}}</td>
  </tr>
  {% endfor %}
</table>
{% endif %}

{% include 'footer.html' %}

</body>
</html>
